<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STL Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; font-family: sans-serif; }
  #canvas-container { width: 100%; height: 100%; }
  #dropzone {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ccc; font-size: 20px; pointer-events: none; text-align: center; padding: 20px;
  }
  #dropzone.hidden { display: none; }
  #dropzone.dragover { background: rgba(80, 140, 255, 0.15); }
  #info {
    position: fixed; top: 10px; left: 10px; color: #ccc; font-size: 13px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }
  #fileInput { display: none; }
  #controls-panel {
    position: fixed; top: 10px; right: 10px; display: flex; gap: 6px;
  }
  #controls-panel button {
    background: rgba(0,0,0,0.4); color: #ccc; border: 1px solid #555; border-radius: 4px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  #controls-panel button:hover { background: rgba(255,255,255,0.1); }
  #controls-panel button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  #sub-panel {
    position: fixed; top: 48px; right: 10px; display: flex; flex-direction: column;
    gap: 6px; align-items: flex-end;
  }
  #clip-panel {
    display: none; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.4); border: 1px solid #555; border-radius: 4px; padding: 6px 10px;
  }
  #clip-panel.visible { display: flex; }
  #clip-panel span { color: #ccc; font-size: 12px; }
  #clip-panel button {
    background: rgba(255,255,255,0.08); color: #ccc; border: 1px solid #555; border-radius: 4px;
    padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  #clip-panel button.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  #clipSlider { width: 120px; }
  #measure-label {
    display: none; color: #ffcc00; font-size: 13px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px;
  }
  #measure-label.visible { display: block; }
</style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="dropzone">STL-Datei hier ablegen oder klicken zum Auswählen</div>
  <div id="info"></div>
  <div id="controls-panel">
    <button id="btnWireframe">Wireframe</button>
    <button id="btnAxes" class="active">Achsen</button>
    <button id="btnClip">Schnitt</button>
    <button id="btnMeasure">Messen</button>
  </div>
  <div id="sub-panel">
    <div id="clip-panel">
      <span>Achse:</span>
      <button id="clipAxisX" class="active">X</button>
      <button id="clipAxisY">Y</button>
      <button id="clipAxisZ">Z</button>
      <input type="range" id="clipSlider" min="-100" max="100" value="0">
    </div>
    <div id="measure-label"></div>
  </div>
  <input type="file" id="fileInput" accept=".stl">

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const dropzone = document.getElementById('dropzone');
    const info = document.getElementById('info');
    const fileInput = document.getElementById('fileInput');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, 0, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.localClippingEnabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(1, 1, 1);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(200, 20, 0x555555, 0x333333);
    scene.add(grid);

    const axes = new THREE.AxesHelper(100);
    scene.add(axes);

    let currentMesh = null;
    let wireframeOn = false;
    let axesOn = true;
    let currentMaxDim = 100;

    const clipAxisVectors = {
      x: new THREE.Vector3(1, 0, 0),
      y: new THREE.Vector3(0, 1, 0),
      z: new THREE.Vector3(0, 0, 1),
    };
    let clipAxis = 'x';
    let clipOn = false;
    const clipPlane = new THREE.Plane(clipAxisVectors.x.clone(), 0);
    const clipPlaneHelper = new THREE.PlaneHelper(clipPlane, 100, 0xffcc00);
    clipPlaneHelper.visible = false;
    scene.add(clipPlaneHelper);

    let measureMode = false;
    let measurePoints = [];
    let measureMarkers = [];
    let measureLine = null;
    const raycaster = new THREE.Raycaster();
    const mouseNdc = new THREE.Vector2();
    let pointerDownPos = null;

    function clearMeasurement() {
      for (const m of measureMarkers) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
      measureMarkers = [];
      if (measureLine) { scene.remove(measureLine); measureLine.geometry.dispose(); measureLine.material.dispose(); measureLine = null; }
      measurePoints = [];
    }

    function addMeasurePoint(point) {
      if (measurePoints.length >= 2) clearMeasurement();
      measurePoints.push(point);
      const markerGeo = new THREE.SphereGeometry(currentMaxDim * 0.012, 12, 12);
      const marker = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
      marker.position.copy(point);
      scene.add(marker);
      measureMarkers.push(marker);

      if (measurePoints.length === 2) {
        const geo = new THREE.BufferGeometry().setFromPoints(measurePoints);
        measureLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffcc00 }));
        scene.add(measureLine);
        const dist = measurePoints[0].distanceTo(measurePoints[1]);
        measureLabel.textContent = `Abstand: ${dist.toFixed(2)} mm`;
      } else {
        measureLabel.textContent = 'Zweiten Punkt anklicken …';
      }
    }

    function loadSTLArrayBuffer(arrayBuffer, name) {
      const loader = new THREE.STLLoader();
      const geometry = loader.parse(arrayBuffer);
      geometry.computeBoundingBox();
      geometry.center();

      if (currentMesh) {
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
        currentMesh.material.dispose();
      }

      const material = new THREE.MeshPhongMaterial({
        color: 0x4a90d9, specular: 0x111111, shininess: 100, wireframe: wireframeOn,
        side: THREE.DoubleSide, clippingPlanes: clipOn ? [clipPlane] : []
      });
      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);

      const box = geometry.boundingBox;
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      currentMaxDim = maxDim;

      grid.scale.setScalar(maxDim / 200 * 1.5 || 1);
      axes.scale.setScalar(maxDim / 100 * 0.75 || 1);
      clipPlaneHelper.scale.setScalar(maxDim / 100 * 1.5 || 1);
      clipPlane.constant = 0;
      clipSlider.value = 0;
      clearMeasurement();
      measureLabel.textContent = measureMode ? 'Ersten Punkt anklicken …' : '';

      const dist = maxDim * 1.8;
      camera.position.set(dist, dist * 0.6, dist);
      camera.near = maxDim / 1000;
      camera.far = maxDim * 100;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();

      info.textContent = `${name}  —  ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm  —  ${geometry.attributes.position.count / 3 | 0} Dreiecke`;
      dropzone.classList.add('hidden');
    }

    function handleFile(file) {
      if (!file || !file.name.toLowerCase().endsWith('.stl')) return;
      const reader = new FileReader();
      reader.onload = (e) => loadSTLArrayBuffer(e.target.result, file.name);
      reader.readAsArrayBuffer(file);
    }

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });
    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFile(e.dataTransfer.files[0]);
    });
    dropzone.style.pointerEvents = 'auto';
    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    const btnWireframe = document.getElementById('btnWireframe');
    const btnAxes = document.getElementById('btnAxes');

    btnWireframe.addEventListener('click', () => {
      wireframeOn = !wireframeOn;
      btnWireframe.classList.toggle('active', wireframeOn);
      if (currentMesh) currentMesh.material.wireframe = wireframeOn;
    });

    btnAxes.addEventListener('click', () => {
      axesOn = !axesOn;
      btnAxes.classList.toggle('active', axesOn);
      axes.visible = axesOn;
    });

    const btnClip = document.getElementById('btnClip');
    const clipPanel = document.getElementById('clip-panel');
    const clipSlider = document.getElementById('clipSlider');
    const clipAxisButtons = {
      x: document.getElementById('clipAxisX'),
      y: document.getElementById('clipAxisY'),
      z: document.getElementById('clipAxisZ'),
    };

    function setClipAxis(axisKey) {
      clipAxis = axisKey;
      clipPlane.normal.copy(clipAxisVectors[axisKey]);
      clipPlane.constant = 0;
      clipSlider.value = 0;
      for (const key in clipAxisButtons) clipAxisButtons[key].classList.toggle('active', key === axisKey);
    }

    for (const key in clipAxisButtons) {
      clipAxisButtons[key].addEventListener('click', () => setClipAxis(key));
    }

    clipSlider.addEventListener('input', () => {
      const fraction = Number(clipSlider.value) / 100;
      clipPlane.constant = fraction * (currentMaxDim / 2);
    });

    btnClip.addEventListener('click', () => {
      clipOn = !clipOn;
      btnClip.classList.toggle('active', clipOn);
      clipPanel.classList.toggle('visible', clipOn);
      clipPlaneHelper.visible = clipOn;
      if (currentMesh) currentMesh.material.clippingPlanes = clipOn ? [clipPlane] : [];
    });

    const btnMeasure = document.getElementById('btnMeasure');
    const measureLabel = document.getElementById('measure-label');

    btnMeasure.addEventListener('click', () => {
      measureMode = !measureMode;
      btnMeasure.classList.toggle('active', measureMode);
      measureLabel.classList.toggle('visible', measureMode);
      clearMeasurement();
      measureLabel.textContent = measureMode ? 'Ersten Punkt anklicken …' : '';
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!measureMode || !currentMesh || !pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 5) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouseNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseNdc, camera);
      const hits = raycaster.intersectObject(currentMesh);
      if (hits.length === 0) return;
      addMeasurePoint(hits[0].point.clone());
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
