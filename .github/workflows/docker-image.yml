# Container-Image bauen und in der GitHub Container Registry veröffentlichen:
#   ghcr.io/<owner>/druck-konfigurator:latest | :<Version aus CHANGELOG.md> | :sha-<commit>
# amd64 und arm64 jeweils auf eigener Maschine (kein QEMU – OrcaSlicer entpacken ginge emuliert sehr langsam),
# danach ein gemeinsames Multi-Arch-Tag. Nutzen: NAS-Container (docker compose) und das Home-Assistant-Add-on
# (TMA84/ha-addons, Ordner druck-konfigurator).
# Gebaut wird erst, wenn die Tests (.github/workflows/tests.yml) für diesen Stand auf main grün sind – kein Image und
# damit kein Release aus einem Stand mit Fehlern. Zuletzt legt der Job release die Version als GitHub-Release an. Von Hand: Run workflow (ohne Tests).
name: Container-Image

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Release-Tag (Job release)
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version und Name
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/druck-konfigurator" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=Druckwerkstatt mit OrcaSlicer (Kostenkalkulation) und LAN-Modus für Anycubic
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Kurztest des Images
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}"
          docker run -d --name druck-test -p 8765:8765 "$img"
          # Antwort erst ganz lesen, dann prüfen: „curl | grep -q“ mit pipefail scheiterte zufällig (grep schließt die Leitung
          # früh → curl Schreibfehler 23); dazu Wiederholungen, falls der frisch gestartete Server eine Verbindung zurücksetzt
          get() { curl -fsS --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 "http://127.0.0.1:8765$1"; }
          for i in $(seq 1 30); do get /api/health >/dev/null 2>&1 && break; sleep 2; done
          health="$(get /api/health)" || { docker logs druck-test; exit 1; }
          echo "$health"
          grep -q '"slicer": "2' <<<"$health" || { docker logs druck-test; exit 1; }
          page="$(get /)"
          grep -q 'Druckwerkstatt' <<<"$page"

    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-Arch-Tags
        run: |
          set -euo pipefail
          img="${{ needs.build.outputs.image }}"; v="${{ needs.build.outputs.version }}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          docker buildx imagetools create -t "$img:$v" -t "$img:latest" -t "$img:sha-${sha::7}" "$img:$v-amd64" "$img:$v-arm64"

  # GitHub-Release je Version: oberste Version aus CHANGELOG.md („## [X.Y.Z] – Datum“) als Tag vX.Y.Z, Text = Abschnitt
  # dieser Version. Gibt es den Tag schon (oder steht oben „Unveröffentlicht“), passiert nichts.
  release:
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Version und Text aus CHANGELOG.md
        id: v
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' || true)
          top=$(grep -m1 -E '^## \[' CHANGELOG.md || true)
          if [ -z "$version" ] || ! printf '%s' "$top" | grep -qF "[$version]"; then
            echo "Oberste Version ist nicht veröffentlicht ($top) – kein Release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version gibt es schon – kein Release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/druck-konfigurator:$version"
          printf '\n---\nContainer-Image: `%s` (amd64, arm64) · Home-Assistant-Add-on: Version %s\n' "$image" "$version" >> notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Tag und Release anlegen
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" --target "$(git rev-parse HEAD)" --title "$v" --notes-file notes.md --latest
