# GitHub-Release je Version: sobald das Container-Image für einen Stand auf main fertig gebaut ist, wird die oberste
# Version aus CHANGELOG.md („## [X.Y.Z] – Datum“) als Tag vX.Y.Z und Release angelegt – mit dem Abschnitt dieser
# Version als Text und Verweis auf das Image. Gibt es den Tag schon (oder steht oben „Unveröffentlicht“), passiert nichts.
# Von Hand: Actions → Release → Run workflow (nimmt den aktuellen Stand von main).
name: Release

on:
  workflow_run:
    workflows: [Container-Image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Version und Text aus CHANGELOG.md
        id: v
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' || true)
          top=$(grep -m1 -E '^## \[' CHANGELOG.md || true)
          if [ -z "$version" ] || ! printf '%s' "$top" | grep -q "\[$version\]"; then
            echo "Oberste Version ist nicht veröffentlicht ($top) – kein Release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version gibt es schon – kein Release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Abschnitt dieser Version (bis zur nächsten Überschrift „## [“)
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/druck-konfigurator:$version"
          printf '\n---\nContainer-Image: `%s` (amd64, arm64) · Home-Assistant-Add-on: Version %s\n' "$image" "$version" >> notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tag und Release anlegen
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" --target "$(git rev-parse HEAD)" --title "$v" --notes-file notes.md --latest
