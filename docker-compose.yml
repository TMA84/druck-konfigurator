# Start: docker compose up -d --build   →   http://<NAS-IP>:8765/
services:
  druck-konfigurator:
    build: .
    image: druck-konfigurator:latest
    container_name: druck-konfigurator
    ports:
      - "8765:8765"
    restart: unless-stopped
    # Der Container baut die Verbindungen zum Drucker selbst auf (ausgehend) – dafür reicht das normale
    # Docker-Netz. Nur falls der Drucker trotzdem nicht erreichbar ist: stattdessen
    #   network_mode: host
    # (dann entfällt "ports", die Seite liegt direkt auf Port 8765 des NAS).
